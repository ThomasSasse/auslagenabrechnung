<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thomas Auslagenabrechnung</title>
  <meta name="apple-mobile-web-app-title" content="Thomas Auslagenabrechnung" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <meta name="theme-color" content="#9f1239" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #fffbe6;
      margin: 0;
      padding: 1rem;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      align-items: center;
      flex-wrap: nowrap;
    }

    .row input[type="text"] {
      flex: 1;
      min-width: 0;
      max-width: 250px;
      padding: 0.4rem;
    }

    .row input[type="number"] {
      width: 100px;
      min-width: 0;
      padding: 0.4rem;
    }

    .row input[type="checkbox"] {
      flex: 0 0 auto;
    }

    .button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #9f1239;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #error {
      color: #9f1239;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .row {
        flex-wrap: nowrap;
        gap: 0.5rem;
      }

      .row input[type="number"] {
        width: 75px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="assets/header.png"
         alt="Gemeinsame Auslagenabrechnung"
         style="width:100%; border-radius:1rem; margin-bottom:1rem;" />

    <h1>Auslagenabrechnung</h1>

    <p>Gemeinsame Ausgaben erfassen, Kosten fair aufteilen und Zahlungen einfach ausgleichen.</p>

    <div id="error" role="alert"></div>
    <div id="families"></div>

    <button class="button" onclick="addFamily()">
      + Teilnehmer hinzufügen
    </button>

    <h2 style="margin-top:2rem">
      Ausgleichszahlungen
    </h2>

    <ul id="payments"></ul>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBnmptcPPnOXDMCPL6OE_CHOl1xCS-Xgsk",
      authDomain: "geschenkapp-91046.firebaseapp.com",
      databaseURL: "https://geschenkapp-91046-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "geschenkapp-91046",
      storageBucket: "geschenkapp-91046.firebasestorage.app",
      messagingSenderId: "762458542948",
      appId: "1:762458542948:web:9bdd39d254a6670c21a071"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const ref = db.ref("familien");
    const timers = new Map();

    const currency = new Intl.NumberFormat("de-DE", {
      style: "currency",
      currency: "EUR"
    });

    function showError(error) {
      document.getElementById("error").textContent =
        "Datenbankfehler: " + error.message;
    }

    function clearError() {
      document.getElementById("error").textContent = "";
    }

    function isPlaceholder(name) {
      return /^(Teilnehmer|Familie) \d+$/.test(name || "");
    }

    ref.on("value", snapshot => {
      clearError();
      render(snapshot.val() || {});
    }, showError);

    function render(data) {

      const container = document.getElementById("families");
      container.innerHTML = "";

      const entries = Object.entries(data);
      const active = entries.filter(([_, p]) => p.active);

      entries.forEach(([id, p]) => {

        const row = document.createElement("div");
        row.className = "row";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = p.active;
        cb.onchange = () => update(id, "active", cb.checked);

        const name = document.createElement("input");
        name.type = "text";
        name.value = p.name;
        name.placeholder = "Name";
        name.onblur = () => {
          if (name.value !== p.name) {
            update(id, "name", name.value.trim());
          }
        };

        const val = document.createElement("input");
        val.type = "number";
        val.step = "0.01";
        val.min = "0";
        val.value = p.contribution;

        val.onblur = () => {
          const amount = Math.max(
            0,
            Math.round((parseFloat(val.value) || 0) * 100) / 100
          );

          if (amount !== p.contribution) {
            update(id, "contribution", amount);
          }
        };

        const delBtn = document.createElement("button");

        delBtn.innerText = "🗑️";
        delBtn.title = "Eintrag löschen";
        delBtn.style.padding = "0.3rem 0.6rem";
        delBtn.style.borderRadius = "6px";
        delBtn.style.border = "none";
        delBtn.style.background = "#eee";
        delBtn.style.cursor = "pointer";

        delBtn.onclick = () => {
          if (confirm("Soll dieser Eintrag gelöscht werden?")) {
            ref.child(id).remove().catch(showError);
          }
        };

        row.append(cb, name, val, delBtn);
        container.appendChild(row);

        if (isPlaceholder(p.name) && !timers.has(id)) {

          const timer = setTimeout(() => {

            ref.child(id).transaction(entry => {
              if (
                entry &&
                entry.name === p.name &&
                Number(entry.contribution) === 0
              ) {
                return null;
              }
            }).catch(showError);

            timers.delete(id);

          }, 30000);

          timers.set(id, timer);

        } else if (!isPlaceholder(p.name) && timers.has(id)) {

          clearTimeout(timers.get(id));
          timers.delete(id);

        }
      });

      calculatePayments(active);
    }

    function calculatePayments(active) {

      const list = document.getElementById("payments");
      list.innerHTML = "";

      if (!active.length) {
        list.innerHTML = "<li>Noch keine Teilnehmer vorhanden.</li>";
        return;
      }

      const total = active.reduce(
        (sum, [_, p]) =>
          sum + Math.round((Number(p.contribution) || 0) * 100),
        0
      );

      const baseShare = Math.floor(total / active.length);
      const remainder = total % active.length;

      const balances = active.map(([id, p], index) => {

        const paid = Math.round(
          (Number(p.contribution) || 0) * 100
        );

        const share = baseShare + (index < remainder ? 1 : 0);

        return {
          name: p.name,
          balance: paid - share
        };
      });

      const creditors = balances.filter(p => p.balance > 0);
      const debtors = balances.filter(p => p.balance < 0);

      const payments = [];

      for (const debtor of debtors) {

        let owed = -debtor.balance;

        for (const creditor of creditors) {

          const amount = Math.min(owed, creditor.balance);

          if (amount > 0) {

            payments.push(
              `${debtor.name} zahlt ${currency.format(amount / 100)} an ${creditor.name}`
            );

            owed -= amount;
            creditor.balance -= amount;
          }

          if (owed === 0) break;
        }
      }

      if (!payments.length) {

        list.innerHTML = "<li>Alle Auslagen sind ausgeglichen.</li>";

      } else {

        payments.forEach(payment => {

          const li = document.createElement("li");
          li.textContent = payment;
          list.appendChild(li);

        });
      }
    }

    function update(id, key, value) {

      ref.child(id)
        .update({ [key]: value })
        .catch(showError);
    }

    async function addFamily() {

      try {

        const snapshot = await ref.once("value");
        const data = snapshot.val() || {};

        const usedNames = Object.values(data).map(p => p.name);

        let next = 1;

        while (
          usedNames.includes("Teilnehmer " + next) ||
          usedNames.includes("Familie " + next)
        ) {
          next++;
        }

        await ref.push({
          name: "Teilnehmer " + next,
          active: true,
          contribution: 0
        });

      } catch (error) {
        showError(error);
      }
    }
  </script>
</body>
</html>
